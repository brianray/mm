[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "marmir"
dynamic = ["version"]
version = "2.1.1"
description = "Marmir: Python data structures to spreadsheets -- built for humans and GenAI agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Brian Ray", email = "brianhray@gmail.com" }]
maintainers = [{ name = "Brian Ray", email = "brianhray@gmail.com" }]
keywords = [
    "spreadsheet", "excel", "xlsx", "xls", "csv", "openpyxl",
    "llm", "genai", "mcp", "openai", "anthropic", "claude", "agents", "tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
xls = ["xlwt>=1.3", "xlrd>=2.0"]
images = ["pillow>=10"]
pandas = ["pandas>=2.0"]
django = ["django>=4.2"]
prettytable = ["prettytable>=3.0"]
gsheets = ["gspread>=6.0"]
mcp = ["mcp>=1.2"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
all = [
    "marmir[xls,images,pandas,prettytable,gsheets,mcp,server]",
]
dev = [
    "marmir[all,django]",
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/brianray/mm"
Documentation = "https://github.com/brianray/mm/tree/master/docs"
Issues = "https://github.com/brianray/mm/issues"
Changelog = "https://github.com/brianray/mm/blob/master/CHANGELOG.md"

[project.scripts]
marmir = "mm.cli:main"
marmir-mcp = "mm.ai.mcp_server:main"

[tool.hatch.version]
path = "src/mm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mm"]

[tool.hatch.build.targets.sdist]
include = [
    "src/mm", "tests", "docs", "examples", "skills", "README.md", "CHANGELOG.md",
    ".claude-plugin", ".mcp.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:mm.*"]

[tool.coverage.run]
source = ["mm"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "PT"]
ignore = [
    "RUF012",  # mutable class defaults are intentional (legacy class-attribute config)
    "B905",    # zip() without strict= -- lengths are checked where it matters
    "B008",    # FastAPI's Body()/Depends() defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011", "PT018", "PT030", "E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/mm"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
